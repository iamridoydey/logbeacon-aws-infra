name: Bootstrap ci on destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: logbeacon-bootstrap-infra
  cancel-in-progress: false

jobs:
  destroy:
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest

    environment: bootstrap-destroy

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/bootstrap-infra-role

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate terraform.tfvars
        working-directory: terraform/bootstrap-infra
        run: |
          cat > terraform.tfvars <<EOF
          environment       = "${{ vars.ENVIRONMENT }}"
          github_username   = "${{ vars.GH_USERNAME }}"
          github_account_id = "${{ vars.GH_ACCOUNT_ID }}"
          github_repo_id    = "${{ vars.GH_REPO_ID }}"
          EOF

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform/bootstrap-infra
        run: terraform init -input=false

      - name: Terraform Destroy Plan
        working-directory: terraform/bootstrap-infra
        run: |
          terraform plan \
            -destroy \
            -input=false \
            -var-file="terraform.tfvars" \
            -out=destroy.tfplan

      - name: Terraform Destroy
        working-directory: terraform/bootstrap-infra
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            destroy.tfplan
