name: Main ci destroy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm tearing down all LogBeacon infra'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: main-infra
  cancel-in-progress: false

jobs:
  # Fails fast unless the person typed the exact confirmation word —
  # a second, explicit check on top of the environment approval gate
  # below, since this is the single most destructive pipeline in
  # the project.
  confirm-intent:
    name: Confirm destroy intent
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation text did not match 'destroy'. Aborting."
            exit 1
          fi

  teardown-cluster-and-infra:
    name: Stop ArgoCD, delete apps, destroy infra
    runs-on: ubuntu-latest
    needs:
      - confirm-intent
    # Second gate — pauses for a human's explicit GitHub approval,
    # on top of the typed confirmation above.
    environment: main-infra-destroy
    timeout-minutes: 90

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: terraform/main-infra

    steps:
      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-infra-bootstrap-ci-role

      - uses: actions/checkout@v7

      # terraform_wrapper: false — needed for `terraform output -raw`
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      # Read outputs from existing state before anything is touched —
      # need the admin instance id and both cluster names to reach in
      # and tear down cleanly. Names match outputs.tf / the merge
      # pipeline exactly — keep these in sync if outputs.tf changes.
      - name: Terraform init and read outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          echo "logbeacon_admin_ec2_id=$(terraform output -raw logbeacon_admin_ec2_id)" >> "$GITHUB_OUTPUT"
          echo "management_cluster_name=$(terraform output -raw management_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "workload_cluster_name=$(terraform output -raw workload_cluster_name)" >> "$GITHUB_OUTPUT"

      # Wait until SSM Agent on the admin instance is Online — same
      # check as the merge pipeline. If the instance is already
      # gone or never came up, there is nothing left to tear down
      # from inside the cluster, so fail loudly rather than silently
      # skipping straight to terraform destroy against a live cluster.
      - name: Wait for admin instance SSM
        env:
          INSTANCE_ID: ${{ steps.tf_outputs.outputs.logbeacon_admin_ec2_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text || true)
            echo "SSM ping=${status}"
            if [[ "${status}" == "Online" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Admin instance never reported Online to SSM"
          exit 1

      # -----------------------------------------------------------
      # Tear down all the argocd applications
      # -----------------------------------------------------------
      - name: Tear down ArgoCD-managed resources on admin EC2
        env:
          INSTANCE_ID: ${{ steps.tf_outputs.outputs.logbeacon_admin_ec2_id }}
          MGMT_CLUSTER: ${{ steps.tf_outputs.outputs.management_cluster_name }}
          WORKLOAD_CLUSTER: ${{ steps.tf_outputs.outputs.workload_cluster_name }}
        run: |
          set -euo pipefail

          cat > /tmp/teardown.sh <<EOF
          set -euo pipefail
          export AWS_REGION="${AWS_REGION}"

          aws eks update-kubeconfig --name "${MGMT_CLUSTER}" --region "${AWS_REGION}" --alias management
          aws eks update-kubeconfig --name "${WORKLOAD_CLUSTER}" --region "${AWS_REGION}" --alias workload

          kubectl config use-context management

          echo "--- Disabling auto-sync on root Applications ---"
          kubectl patch application management-root -n argocd --type merge \
            -p '{"spec":{"syncPolicy":null}}' || true
          kubectl patch application workload-root -n argocd --type merge \
            -p '{"spec":{"syncPolicy":null}}' || true

          echo "--- Orphan-deleting root Applications (children untouched) ---"
          kubectl delete application management-root -n argocd \
            --cascade=orphan --ignore-not-found
          kubectl delete application workload-root -n argocd \
            --cascade=orphan --ignore-not-found

          echo "--- Cascade-deleting WORKLOAD-cluster Applications first ---"
          kubectl get applications -n argocd -o name | \
            grep -i workload | \
            xargs -r -n1 kubectl delete --cascade=foreground -n argocd --timeout=300s

          echo "--- Verifying no LoadBalancer Services remain (workload cluster) ---"
          kubectl config use-context workload
          for i in \$(seq 1 30); do
            remaining=\$(kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}/{.metadata.name} {end}' | wc -w)
            echo "LoadBalancer Services remaining: \${remaining}"
            if [ "\${remaining}" -eq 0 ]; then
              break
            fi
            sleep 15
          done

          echo "--- Verifying no Gateway API Gateways remain (workload cluster) ---"
          for i in \$(seq 1 30); do
            remaining=\$(kubectl get gateways.gateway.networking.k8s.io -A --no-headers 2>/dev/null | wc -l)
            echo "Gateways remaining: \${remaining}"
            if [ "\${remaining}" -eq 0 ]; then
              break
            fi
            sleep 15
          done

          kubectl config use-context management

          echo "--- Cascade-deleting MANAGEMENT-cluster Applications ---"
          kubectl get applications -n argocd -o name | \
            xargs -r -n1 kubectl delete --cascade=foreground -n argocd --timeout=300s

          echo "--- All Applications removed. Uninstalling ArgoCD ---"
          helm uninstall argocd -n argocd || true
          kubectl delete namespace argocd --ignore-not-found
          EOF

          CMD_ID=\$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "argocd-teardown-${GITHUB_RUN_ID}" \
            --timeout-seconds 3600 \
            --parameters commands="\$(cat /tmp/teardown.sh)" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command id=\${CMD_ID}"
          aws ssm wait command-executed \
            --command-id "\${CMD_ID}" \
            --instance-id "${INSTANCE_ID}"

          aws ssm get-command-invocation \
            --command-id "\${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

      # -----------------------------------------------------------
      # Generate terraform.tfvars
      # -----------------------------------------------------------
      - name: Generate terraform.tfvars
        working-directory: ${{ env.TF_DIR }}
        env:
          LOGBEACON_SECRETS_HCL: ${{ secrets.LOGBEACON_SECRETS }}
          GITHUB_SECRETS_HCL: ${{ secrets.GITHUB_SECRETS }}
          CLOUDFLARE_SECRETS_HCL: ${{ secrets.CLOUDFLARE_SECRETS }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD }}
          SONARQUBE_MONITORING_PASSCODE: ${{ secrets.SONARQUBE_MONITORING_PASSCODE }}
        run: |
          set -euo pipefail
          umask 077
          cat > terraform.tfvars <<EOF
          logbeacon_secrets = ${LOGBEACON_SECRETS_HCL}
          github_secrets = ${GITHUB_SECRETS_HCL}
          cloudflare_secrets = ${CLOUDFLARE_SECRETS_HCL}
          sonarqube_admin_password = "${SONARQUBE_ADMIN_PASSWORD}"
          environment = "${{ vars.ENVIRONMENT }}"
          sonarqube_monitoring_passcode = "${SONARQUBE_MONITORING_PASSCODE}"
          EOF

      - name: Terraform destroy
        id: destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -input=false -auto-approve -var-file=terraform.tfvars

      - name: Remove terraform.tfvars
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: rm -f terraform.tfvars

      - name: Done
        run: echo "LogBeacon main-infra teardown complete."