name: Main infra destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm tearing down main-infra'
        required: true
        type: string
      skip_k8s_cleanup:
        description: "Skip the Kubernetes cleanup and only run terraform destroy (use when the clusters are broken/unreachable)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: main-infra
  cancel-in-progress: false

jobs:
  destroy:
    name: Clean Kubernetes, then terraform destroy main-infra
    # Only run when confirmed AND started from main.
    if: ${{ inputs.confirm == 'destroy' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Produces the OIDC subject "environment:main-infra-destroy" that the CI role trusts.
    # Add required reviewers to this environment in GitHub settings.
    environment: main-infra-destroy
    timeout-minutes: 120

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: terraform/main-infra

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-infra-bootstrap-ci-role

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Generate terraform.tfvars
        working-directory: ${{ env.TF_DIR }}
        env:
          LOGBEACON_SECRETS_HCL: ${{ secrets.LOGBEACON_SECRETS }}
          GITHUB_SECRETS_HCL: ${{ secrets.GH_SECRETS }}
          CLOUDFLARE_SECRETS_HCL: ${{ secrets.CLOUDFLARE_SECRETS }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD }}
          SONARQUBE_MONITORING_PASSCODE: ${{ secrets.SONARQUBE_MONITORING_PASSCODE }}
        run: |
          set -euo pipefail
          umask 077
          cat > terraform.tfvars <<EOF
          logbeacon_secrets = ${LOGBEACON_SECRETS_HCL}
          github_secrets = ${GITHUB_SECRETS_HCL}
          cloudflare_secrets = ${CLOUDFLARE_SECRETS_HCL}
          sonarqube_admin_password = "${SONARQUBE_ADMIN_PASSWORD}"
          environment = "${{ vars.ENVIRONMENT }}"
          sonarqube_monitoring_passcode = "${SONARQUBE_MONITORING_PASSCODE}"
          EOF

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      # -----------------------------------------------------------------
      # Decide whether there is anything to clean inside Kubernetes.
      #
      # Argo CD is only ever installed BY the admin EC2 (bootstrap step of the
      # merge workflow). So no usable admin instance = no Argo CD = no
      # Argo-created load balancers. In that case we skip and just destroy.
      # -----------------------------------------------------------------
      - name: Detect what exists
        id: detect
        working-directory: ${{ env.TF_DIR }}
        env:
          SKIP_K8S_CLEANUP: ${{ inputs.skip_k8s_cleanup }}
        run: |
          set -euo pipefail

          # Read from state. Missing output (empty/partial state) => empty string.
          out() { terraform output -raw "$1" 2>/dev/null || true; }
          INSTANCE_ID=$(out logbeacon_admin_ec2_id)
          MGMT=$(out management_cluster_name)
          WORKLOAD=$(out workload_cluster_name)

          {
            echo "instance_id=${INSTANCE_ID}"
            echo "management_cluster_name=${MGMT}"
            echo "workload_cluster_name=${WORKLOAD}"
          } >> "$GITHUB_OUTPUT"

          CLEANUP=false

          if [[ "${SKIP_K8S_CLEANUP}" == "true" ]]; then
            echo "::warning::skip_k8s_cleanup=true. Load balancers/volumes created from Kubernetes will NOT be cleaned."
          elif [[ -z "${INSTANCE_ID}" ]]; then
            echo "No admin instance in Terraform state. Nothing was bootstrapped, skipping Kubernetes cleanup."
          else
            if RESULT=$(aws ec2 describe-instances \
                --instance-ids "${INSTANCE_ID}" \
                --query 'Reservations[0].Instances[0].State.Name' \
                --output text 2>&1); then
              STATE="${RESULT}"
            elif grep -q 'InvalidInstanceID' <<<"${RESULT}"; then
              STATE="not-found"
            else
              # Real error (permissions, network...). Do NOT silently skip.
              echo "::error::Could not check the admin instance: ${RESULT}"
              exit 1
            fi
            echo "Admin instance ${INSTANCE_ID} state: ${STATE}"

            case "${STATE}" in
              running|pending)
                CLEANUP=true
                ;;
              not-found|None|terminated|shutting-down)
                echo "Admin instance is gone. Skipping Kubernetes cleanup."
                ;;
              *)
                echo "::error::Admin instance is '${STATE}', so the Kubernetes cleanup cannot run. Start it and re-run, or re-run with skip_k8s_cleanup=true if you accept leftover AWS resources."
                exit 1
                ;;
            esac
          fi

          echo "cleanup=${CLEANUP}" >> "$GITHUB_OUTPUT"
          echo "Kubernetes cleanup: ${CLEANUP}"

      - name: Wait for admin instance SSM
        if: steps.detect.outputs.cleanup == 'true'
        env:
          INSTANCE_ID: ${{ steps.detect.outputs.instance_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text || true)
            echo "SSM ping=${status}"
            if [[ "${status}" == "Online" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Admin instance never reported Online to SSM. Fix it, or re-run with skip_k8s_cleanup=true."
          exit 1

      # -----------------------------------------------------------------
      # Runs ON the admin EC2 (it can reach the private EKS API).
      #
      # Order matters:
      #  1. Stop Argo CD so it cannot recreate what we delete.
      #  2. Delete HTTPRoutes, Gateways, GatewayClasses and LoadBalancer
      #     Services while Gateway/cloud controllers and external-dns are alive.
      #     Wait for resource deletion; stop on errors before deleting namespaces.
      #  3. Best effort: delete app namespaces so EBS volumes are released.
      #
      # Clusters that do not exist / are not ACTIVE are skipped.
      # A cluster that exists but is unreachable is an error (would leak LBs).
      # -----------------------------------------------------------------
      - name: Clean up Kubernetes (load balancers, volumes)
        if: steps.detect.outputs.cleanup == 'true'
        env:
          INSTANCE_ID: ${{ steps.detect.outputs.instance_id }}
          MGMT_CLUSTER: ${{ steps.detect.outputs.management_cluster_name }}
          WORKLOAD_CLUSTER: ${{ steps.detect.outputs.workload_cluster_name }}
        run: |
          #!/bin/bash
          
          # Exit immediately if:
          # - any command fails (-e)
          # - an undefined variable is used (-u)
          # - a command inside a pipeline fails (-o pipefail)
          set -euo pipefail

          # Create a temporary script that will be executed remotely via AWS Systems Manager (SSM)
          cat > /tmp/cleanup_body.sh <<'EOF'

          # Similar safety settings for the remote script
          set -uo pipefail

          # How long to wait for:
          # - Gateway API resources and LoadBalancer Services to be deleted
          LB_WAIT="10m"

          # - Kubernetes namespaces to be deleted
          NS_WAIT="5m"

          # Namespaces that should never be deleted.
          # These contain core Kubernetes components or infrastructure services.
          KEEP_NS='^(default|kube-system|kube-public|kube-node-lease|argocd)$'

          # Tracks whether any errors occurred during cleanup.
          # 0 = success, 1 = at least one failure
          FAILED=0

          # List of clusters that are reachable and ready for cleanup
          READY=()

          # Helper function that automatically uses the correct kubeconfig file
          # for the cluster currently being processed.
          kc() {
            kubectl --kubeconfig "/tmp/kubeconfig-${CUR}" "$@"
          }

          ###############################################################################
          # PHASE 0 - FIND CLUSTERS THAT EXIST AND CAN BE ACCESSED
          ###############################################################################

          echo "##### Phase 0: check which clusters exist and are reachable"

          for C in ${CLUSTERS}; do
            echo "=== Checking cluster ${C}"

            # Check whether the EKS cluster exists and get its current status.
            if ! STATUS=$(aws eks describe-cluster \
                --name "${C}" \
                --region "${AWS_REGION}" \
                --query cluster.status \
                --output text 2>&1); then

              # Cluster does not exist. Skip it.
              if grep -q ResourceNotFoundException <<<"${STATUS}"; then
                echo "Skip: cluster does not exist"

              # Any other error should be reported.
              else
                echo "ERROR: unable to check cluster status: ${STATUS}"
                FAILED=1
              fi
              continue
            fi

            # Only ACTIVE clusters can be cleaned up.
            if [[ "${STATUS}" != "ACTIVE" ]]; then
              echo "Skip: cluster status is ${STATUS}"
              continue
            fi

            # Generate kubeconfig so kubectl can communicate with the cluster.
            if ! aws eks update-kubeconfig \
                --name "${C}" \
                --region "${AWS_REGION}" \
                --kubeconfig "/tmp/kubeconfig-${C}" >/dev/null 2>&1; then

              echo "ERROR: failed to create kubeconfig for ${C}"
              FAILED=1
              continue
            fi

            CUR="${C}"

            # Verify that kubectl can successfully connect to the cluster.
            if ! kc get namespaces >/dev/null 2>&1; then
              echo "ERROR: cluster is running but cannot be accessed"
              FAILED=1
              continue
            fi

            # Cluster is healthy and reachable.
            READY+=("${C}")
          done

          # If no clusters are available, stop here.
          if [[ ${#READY[@]} -eq 0 ]]; then
            echo "No reachable clusters. Nothing to clean."
            exit ${FAILED}
          fi

          ###############################################################################
          # PHASE 1 - STOP ARGO CD
          ###############################################################################

          # Argo CD automatically recreates resources.
          # We stop it first so deleted resources stay deleted.

          echo "##### Phase 1: stop Argo CD so it cannot recreate resources"

          for CUR in "${READY[@]}"; do

            if kc get namespace argocd >/dev/null 2>&1; then

              echo "=== ${CUR}: scaling Argo CD components to zero"

              kc -n argocd scale deployment,statefulset \
                --all \
                --replicas=0 || FAILED=1

            else
              echo "=== ${CUR}: Argo CD not installed"
            fi
          done

          # Give Kubernetes time to stop the Argo CD pods.
          sleep 15

          ###############################################################################
          # PHASE 2 - REMOVE LOAD BALANCERS AND DNS DEPENDENCIES
          ###############################################################################

          # This is whole-cluster cleanup for clusters being destroyed.
          # Keep the Gateway controller, cloud LB controller and external-dns running.
          # Gateway API CRDs are retained until the cluster itself is destroyed.
          echo "##### Phase 2: delete Gateway API resources and LoadBalancer Services"

          # Do not remove network resources if an earlier phase failed.
          if (( FAILED != 0 )); then
            echo "ERROR: an earlier cleanup phase failed"
            exit 1
          fi

          for CUR in "${READY[@]}"; do
            echo "=== ${CUR}"
            COUNT=0

            # Discover installed APIs. Missing Gateway API CRDs are valid on a
            # partially bootstrapped cluster; discovery/authentication failures are not.
            if ! APIS=$(kc api-resources --cached=false -o name); then
              echo "ERROR: API discovery failed on ${CUR}"
              exit 1
            fi

            # Delete routes before their Gateways, and Gateways before GatewayClasses.
            # GatewayClasses are cluster-scoped and can have a gateway-exists finalizer.
            for RESOURCE in \
              httproutes.gateway.networking.k8s.io \
              gateways.gateway.networking.k8s.io \
              gatewayclasses.gateway.networking.k8s.io; do

              if ! grep -Fxq "${RESOURCE}" <<<"${APIS}"; then
                echo "Skip ${RESOURCE}: API is not installed"
                continue
              fi

              SCOPE=(--all-namespaces)
              if [[ "${RESOURCE}" == gatewayclasses.gateway.networking.k8s.io ]]; then
                SCOPE=()
              fi

              if ! ITEMS=$(kc get "${RESOURCE}" "${SCOPE[@]}" -o name); then
                echo "ERROR: could not list ${RESOURCE} on ${CUR}"
                exit 1
              fi
              [[ -z "${ITEMS}" ]] && continue
              COUNT=$((COUNT + 1))

              if ! kc delete "${RESOURCE}" --all "${SCOPE[@]}" \
                --wait=true --timeout="${LB_WAIT}"; then
                echo "ERROR: ${RESOURCE} deletion failed; keeping controllers running"
                exit 1
              fi

              # Give external-dns an opportunity to process removed routes while
              # Gateway status still exists. This is not proof of DNS deletion;
              # actual cleanup depends on its sources, policy and reconciliation interval.
              if [[ "${RESOURCE}" == httproutes.gateway.networking.k8s.io ]]; then
                echo "Allowing 90 seconds for route DNS reconciliation"
                sleep 90
              fi
            done

            # Gateway implementations may expose their proxy using a LoadBalancer
            # Service. Deleting a Gateway does not always delete that shared Service.
            # Capture the list explicitly so API failures cannot be hidden by a loop.
            if ! SERVICES=$(kc get services --all-namespaces \
              -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace} {.metadata.name}{"\n"}{end}'); then
              echo "ERROR: could not list LoadBalancer Services on ${CUR}"
              exit 1
            fi

            while read -r NS NAME; do
              [[ -z "${NAME:-}" ]] && continue
              COUNT=$((COUNT + 1))
              if ! kc -n "${NS}" delete service "${NAME}" \
                --ignore-not-found=true --wait=true --timeout="${LB_WAIT}"; then
                echo "ERROR: Service ${NS}/${NAME} deletion failed; keeping controllers running"
                exit 1
              fi
            done <<<"${SERVICES}"

            if (( COUNT > 0 )); then
              echo "Allowing 90 seconds for remaining DNS reconciliation"
              sleep 90
            fi
          done

          ###############################################################################
          # PHASE 3 - DELETE APPLICATION NAMESPACES
          ###############################################################################

          # Removing application namespaces allows:
          # - pods to terminate
          # - persistent volume claims to detach
          # - EBS volumes to be released

          echo "##### Phase 3 (best effort): delete application namespaces"

          for CUR in "${READY[@]}"; do

            echo "=== ${CUR}"

            NAMESPACES=$(kc get namespaces -o jsonpath='{.items[*].metadata.name}')

            TO_DELETE=()

            # Build a list of namespaces that are safe to remove.
            for NS in ${NAMESPACES}; do

              # Skip protected namespaces.
              [[ "${NS}" =~ ${KEEP_NS} ]] && continue

              TO_DELETE+=("${NS}")
            done

            # Request deletion of application namespaces.
            for NS in "${TO_DELETE[@]:-}"; do
              [[ -z "${NS}" ]] && continue
              kc delete namespace "${NS}" --wait=false || true
            done

            # Wait for namespace deletion.
            for NS in "${TO_DELETE[@]:-}"; do
              [[ -z "${NS}" ]] && continue

              kc wait \
                --for=delete \
                "namespace/${NS}" \
                --timeout="${NS_WAIT}" || \
                echo "WARNING: namespace ${NS} is still terminating"
            done

            # Check whether any Persistent Volumes still exist.
            LEFT=$(kc get persistentvolumes --no-headers 2>/dev/null | wc -l)

            if (( LEFT > 0 )); then
              echo "WARNING: ${LEFT} PersistentVolume(s) remain."
              echo "Check AWS EC2 Volumes for leftover storage."
            fi

          done

          # Return success or failure status.
          exit ${FAILED}
          EOF

          ###############################################################################
          # BUILD FINAL SCRIPT
          ###############################################################################

          # Build a complete script containing:
          # - AWS region
          # - cluster names
          # - cleanup logic
          {
            echo '#!/bin/bash'
            printf 'export AWS_REGION=%q\n' "${AWS_REGION}"
            printf 'export CLUSTERS=%q\n' "${MGMT_CLUSTER} ${WORKLOAD_CLUSTER}"
            cat /tmp/cleanup_body.sh
          } > /tmp/cleanup.sh

          ###############################################################################
          # EXECUTE SCRIPT THROUGH AWS SSM
          ###############################################################################

          # Send the cleanup script to the remote EC2 instance using AWS Systems Manager.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "k8s-cleanup-${GITHUB_RUN_ID}" \
            --timeout-seconds 600 \
            --parameters "$(jq -n \
              --arg s "$(cat /tmp/cleanup.sh)" \
              '{commands:[$s], executionTimeout:["3000"]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command id=${CMD_ID}"

          ###############################################################################
          # WAIT FOR REMOTE SCRIPT TO FINISH
          ###############################################################################

          STATUS=Pending

          # Check status every 10 seconds for up to 50 minutes.
          for i in $(seq 1 300); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)

            echo "SSM status=${STATUS}"

            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 10
          done

          ###############################################################################
          # DISPLAY SCRIPT OUTPUT
          ###############################################################################

          echo "----- cleanup output -----"

          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent \
            --output text

          echo "----- cleanup errors -----"

          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query StandardErrorContent \
            --output text

          ###############################################################################
          # FINAL SAFETY CHECK
          ###############################################################################

          # If cleanup did not succeed, the script exits with failure.
          # This prevents Terraform destroy from running and potentially
          # leaving AWS resources orphaned.

          [[ "${STATUS}" == "Success" ]]

      - name: Terraform destroy plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -destroy -input=false -lock-timeout=5m -var-file=terraform.tfvars -out=tfdestroy

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfdestroy

      - name: Remove terraform.tfvars
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: rm -f terraform.tfvars tfdestroy
