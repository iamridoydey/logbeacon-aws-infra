name: Main infra destroy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm tearing down main-infra'
        required: true
        type: string
      skip_k8s_cleanup:
        description: "Skip the Kubernetes cleanup and only run terraform destroy (use when the clusters are broken/unreachable)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: main-infra
  cancel-in-progress: false
jobs:
  destroy:
    name: Clean Kubernetes, then terraform destroy main-infra
    # Only run when confirmed AND started from main.
    if: ${{ inputs.confirm == 'destroy' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Produces the OIDC subject "environment:main-infra-destroy" that the CI role trusts.
    # Add required reviewers to this environment in GitHub settings.
    environment: main-infra-destroy
    timeout-minutes: 90
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: terraform/main-infra
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-infra-bootstrap-ci-role
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - name: Generate terraform.tfvars
        working-directory: ${{ env.TF_DIR }}
        env:
          LOGBEACON_SECRETS_HCL: ${{ secrets.LOGBEACON_SECRETS }}
          GITHUB_SECRETS_HCL: ${{ secrets.GH_SECRETS }}
          CLOUDFLARE_SECRETS_HCL: ${{ secrets.CLOUDFLARE_SECRETS }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD }}
          SONARQUBE_MONITORING_PASSCODE: ${{ secrets.SONARQUBE_MONITORING_PASSCODE }}
          ARGOCD_ADMIN_PASSWORD: ${{ secrets.ARGOCD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          cat > terraform.tfvars <<EOF
          logbeacon_secrets = ${LOGBEACON_SECRETS_HCL}
          github_secrets = ${GITHUB_SECRETS_HCL}
          cloudflare_secrets = ${CLOUDFLARE_SECRETS_HCL}
          sonarqube_admin_password = "${SONARQUBE_ADMIN_PASSWORD}"
          argocd_admin_password = "${ARGOCD_ADMIN_PASSWORD}"
          environment = "${{ vars.ENVIRONMENT }}"
          sonarqube_monitoring_passcode = "${SONARQUBE_MONITORING_PASSCODE}"
          EOF
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false
      # -----------------------------------------------------------------
      # Decide whether there is anything to clean inside Kubernetes.
      #
      # Argo CD is only ever installed BY the admin EC2 (bootstrap step of the
      # merge workflow). So no usable admin instance = no Argo CD = no
      # Argo-created load balancers. In that case we skip and just destroy.
      # -----------------------------------------------------------------
      - name: Detect what exists
        id: detect
        working-directory: ${{ env.TF_DIR }}
        env:
          SKIP_K8S_CLEANUP: ${{ inputs.skip_k8s_cleanup }}
        run: |
          set -euo pipefail
          # Read from state. Missing output (empty/partial state) => empty string.
          out() { terraform output -raw "$1" 2>/dev/null || true; }
          INSTANCE_ID=$(out logbeacon_admin_ec2_id)
          MGMT=$(out management_cluster_name)
          WORKLOAD=$(out workload_cluster_name)
          {
            echo "instance_id=${INSTANCE_ID}"
            echo "management_cluster_name=${MGMT}"
            echo "workload_cluster_name=${WORKLOAD}"
          } >> "$GITHUB_OUTPUT"
          CLEANUP=false
          if [[ "${SKIP_K8S_CLEANUP}" == "true" ]]; then
            echo "::warning::skip_k8s_cleanup=true. Load balancers/volumes created from Kubernetes will NOT be cleaned."
          elif [[ -z "${INSTANCE_ID}" ]]; then
            echo "No admin instance in Terraform state. Nothing was bootstrapped, skipping Kubernetes cleanup."
          else
            if RESULT=$(aws ec2 describe-instances \
                --instance-ids "${INSTANCE_ID}" \
                --query 'Reservations[0].Instances[0].State.Name' \
                --output text 2>&1); then
              STATE="${RESULT}"
            elif grep -q 'InvalidInstanceID' <<<"${RESULT}"; then
              STATE="not-found"
            else
              # Real error (permissions, network...). Do NOT silently skip.
              echo "::error::Could not check the admin instance: ${RESULT}"
              exit 1
            fi
            echo "Admin instance ${INSTANCE_ID} state: ${STATE}"
            case "${STATE}" in
              running|pending)
                CLEANUP=true
                ;;
              not-found|None|terminated|shutting-down)
                echo "Admin instance is gone. Skipping Kubernetes cleanup."
                ;;
              *)
                echo "::error::Admin instance is '${STATE}', so the Kubernetes cleanup cannot run. Start it and re-run, or re-run with skip_k8s_cleanup=true if you accept leftover AWS resources."
                exit 1
                ;;
            esac
          fi
          echo "cleanup=${CLEANUP}" >> "$GITHUB_OUTPUT"
          echo "Kubernetes cleanup: ${CLEANUP}"
      - name: Wait for admin instance SSM
        if: steps.detect.outputs.cleanup == 'true'
        env:
          INSTANCE_ID: ${{ steps.detect.outputs.instance_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text || true)
            echo "SSM ping=${status}"
            if [[ "${status}" == "Online" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Admin instance never reported Online to SSM. Fix it, or re-run with skip_k8s_cleanup=true."
          exit 1
      # -----------------------------------------------------------------
      # Runs ON the admin EC2 (it can reach the private EKS API).
      #
      # Faster than the previous version:
      #  - shorter, adaptive waits (no fixed 90s sleeps)
      #  - both clusters cleaned in parallel
      #  - namespaces deleted in parallel
      #  - SSM poll interval 5s, 20 min ceiling
      #
      # Order is unchanged:
      #  1. Stop Argo CD so it cannot recreate what we delete.
      #  2. Delete HTTPRoutes, Gateways, GatewayClasses and LoadBalancer
      #     Services while Gateway/cloud controllers and external-dns are alive.
      #  3. Best effort: delete app namespaces so EBS volumes are released.
      # -----------------------------------------------------------------
      - name: Clean up Kubernetes (load balancers, volumes)
        if: steps.detect.outputs.cleanup == 'true'
        env:
          INSTANCE_ID: ${{ steps.detect.outputs.instance_id }}
          MGMT_CLUSTER: ${{ steps.detect.outputs.management_cluster_name }}
          WORKLOAD_CLUSTER: ${{ steps.detect.outputs.workload_cluster_name }}
        run: |
          #!/bin/bash
          set -euo pipefail

          cat > /tmp/cleanup_body.sh <<'EOF'
          set -uo pipefail

          # Adaptive timeouts. Most deletes finish in under a minute.
          # The wait loops exit as soon as the resource is gone.
          LB_WAIT=180          # seconds, hard ceiling per resource
          NS_WAIT=120          # seconds, hard ceiling per namespace
          POLL=5               # seconds between checks

          KEEP_NS='^(default|kube-system|kube-public|kube-node-lease|argocd)$'
          FAILED=0
          READY=()

          kc() {
            kubectl --kubeconfig "/tmp/kubeconfig-${CUR}" "$@"
          }

          # Wait until a resource is gone, or until the ceiling.
          # Returns 0 if gone, 1 if still present.
          wait_gone() {
            local kind="$1" name="$2" ns="${3:-}"
            local args=(get "${kind}" "${name}")
            [[ -n "${ns}" ]] && args+=(-n "${ns}")
            local elapsed=0
            while (( elapsed < LB_WAIT )); do
              if ! kc "${args[@]}" >/dev/null 2>&1; then
                return 0
              fi
              sleep "${POLL}"
              elapsed=$((elapsed + POLL))
            done
            return 1
          }

          ###############################################################################
          # PHASE 0 - FIND CLUSTERS THAT EXIST AND CAN BE ACCESSED
          ###############################################################################
          echo "##### Phase 0: check which clusters exist and are reachable"
          for C in ${CLUSTERS}; do
            echo "=== Checking cluster ${C}"
            if ! STATUS=$(aws eks describe-cluster \
                --name "${C}" \
                --region "${AWS_REGION}" \
                --query cluster.status \
                --output text 2>&1); then
              if grep -q ResourceNotFoundException <<<"${STATUS}"; then
                echo "Skip: cluster does not exist"
              else
                echo "ERROR: unable to check cluster status: ${STATUS}"
                FAILED=1
              fi
              continue
            fi
            if [[ "${STATUS}" != "ACTIVE" ]]; then
              echo "Skip: cluster status is ${STATUS}"
              continue
            fi
            if ! aws eks update-kubeconfig \
                --name "${C}" \
                --region "${AWS_REGION}" \
                --kubeconfig "/tmp/kubeconfig-${C}" >/dev/null 2>&1; then
              echo "ERROR: failed to create kubeconfig for ${C}"
              FAILED=1
              continue
            fi
            CUR="${C}"
            if ! kc get namespaces >/dev/null 2>&1; then
              echo "ERROR: cluster is running but cannot be accessed"
              FAILED=1
              continue
            fi
            READY+=("${C}")
          done

          if [[ ${#READY[@]} -eq 0 ]]; then
            echo "No reachable clusters. Nothing to clean."
            exit ${FAILED}
          fi

          ###############################################################################
          # PHASE 1 - STOP ARGO CD
          ###############################################################################
          echo "##### Phase 1: stop Argo CD so it cannot recreate resources"
          for CUR in "${READY[@]}"; do
            if kc get namespace argocd >/dev/null 2>&1; then
              echo "=== ${CUR}: scaling Argo CD components to zero"
              kc -n argocd scale deployment,statefulset --all --replicas=0 || FAILED=1
            else
              echo "=== ${CUR}: Argo CD not installed"
            fi
          done
          # Brief pause so the scale takes effect. Not a fixed long sleep.
          sleep 5

          ###############################################################################
          # PHASE 2 - REMOVE LOAD BALANCERS AND DNS DEPENDENCIES
          ###############################################################################
          echo "##### Phase 2: delete Gateway API resources and LoadBalancer Services"
          if (( FAILED != 0 )); then
            echo "ERROR: an earlier cleanup phase failed"
            exit 1
          fi

          # Clean one cluster. Runs in the background so both clusters go in parallel.
          clean_cluster() {
            local CUR="$1"
            local COUNT=0
            echo "=== ${CUR}"

            if ! APIS=$(kc api-resources --cached=false -o name); then
              echo "ERROR: API discovery failed on ${CUR}"
              return 1
            fi

            for RESOURCE in \
              httproutes.gateway.networking.k8s.io \
              gateways.gateway.networking.k8s.io \
              gatewayclasses.gateway.networking.k8s.io; do
              if ! grep -Fxq "${RESOURCE}" <<<"${APIS}"; then
                echo "Skip ${RESOURCE}: API is not installed"
                continue
              fi
              SCOPE=(--all-namespaces)
              if [[ "${RESOURCE}" == gatewayclasses.gateway.networking.k8s.io ]]; then
                SCOPE=()
              fi
              if ! ITEMS=$(kc get "${RESOURCE}" "${SCOPE[@]}" -o name); then
                echo "ERROR: could not list ${RESOURCE} on ${CUR}"
                return 1
              fi
              [[ -z "${ITEMS}" ]] && continue
              COUNT=$((COUNT + 1))
              # Fire the delete, then poll until gone (or ceiling).
              kc delete "${RESOURCE}" --all "${SCOPE[@]}" --wait=false || true
              local elapsed=0
              while (( elapsed < LB_WAIT )); do
                local left
                left=$(kc get "${RESOURCE}" "${SCOPE[@]}" -o name 2>/dev/null | wc -l)
                if (( left == 0 )); then
                  break
                fi
                sleep "${POLL}"
                elapsed=$((elapsed + POLL))
              done
              left=$(kc get "${RESOURCE}" "${SCOPE[@]}" -o name 2>/dev/null | wc -l)
              if (( left > 0 )); then
                echo "ERROR: ${RESOURCE} still present after ${LB_WAIT}s on ${CUR}"
                return 1
              fi
            done

            if ! SERVICES=$(kc get services --all-namespaces \
              -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace} {.metadata.name}{"\n"}{end}'); then
              echo "ERROR: could not list LoadBalancer Services on ${CUR}"
              return 1
            fi
            while read -r NS NAME; do
              [[ -z "${NAME:-}" ]] && continue
              COUNT=$((COUNT + 1))
              kc -n "${NS}" delete service "${NAME}" --ignore-not-found=true --wait=false || true
              if ! wait_gone service "${NAME}" "${NS}"; then
                echo "ERROR: Service ${NS}/${NAME} still present after ${LB_WAIT}s on ${CUR}"
                return 1
              fi
            done <<<"${SERVICES}"

            # One short DNS pause only if we actually deleted something.
            if (( COUNT > 0 )); then
              echo "Allowing 20 seconds for DNS reconciliation on ${CUR}"
              sleep 20
            fi
          }

          PIDS=()
          for CUR in "${READY[@]}"; do
            clean_cluster "${CUR}" &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do
            if ! wait "${pid}"; then
              FAILED=1
            fi
          done
          if (( FAILED != 0 )); then
            echo "ERROR: load balancer cleanup failed on at least one cluster"
            exit 1
          fi

          ###############################################################################
          # PHASE 3 - DELETE APPLICATION NAMESPACES
          ###############################################################################
          echo "##### Phase 3 (best effort): delete application namespaces"
          for CUR in "${READY[@]}"; do
            echo "=== ${CUR}"
            NAMESPACES=$(kc get namespaces -o jsonpath='{.items[*].metadata.name}')
            TO_DELETE=()
            for NS in ${NAMESPACES}; do
              [[ "${NS}" =~ ${KEEP_NS} ]] && continue
              TO_DELETE+=("${NS}")
            done
            # Delete all at once.
            for NS in "${TO_DELETE[@]:-}"; do
              [[ -z "${NS}" ]] && continue
              kc delete namespace "${NS}" --wait=false || true
            done
            # Poll in parallel-ish: one loop over remaining namespaces.
            local_elapsed=0
            while (( local_elapsed < NS_WAIT )); do
              still=0
              for NS in "${TO_DELETE[@]:-}"; do
                [[ -z "${NS}" ]] && continue
                if kc get namespace "${NS}" >/dev/null 2>&1; then
                  still=1
                  break
                fi
              done
              if (( still == 0 )); then
                break
              fi
              sleep "${POLL}"
              local_elapsed=$((local_elapsed + POLL))
            done
            for NS in "${TO_DELETE[@]:-}"; do
              [[ -z "${NS}" ]] && continue
              if kc get namespace "${NS}" >/dev/null 2>&1; then
                echo "WARNING: namespace ${NS} is still terminating"
              fi
            done
            LEFT=$(kc get persistentvolumes --no-headers 2>/dev/null | wc -l)
            if (( LEFT > 0 )); then
              echo "WARNING: ${LEFT} PersistentVolume(s) remain."
              echo "Check AWS EC2 Volumes for leftover storage."
            fi
          done

          exit ${FAILED}
          EOF

          {
            echo '#!/bin/bash'
            printf 'export AWS_REGION=%q\n' "${AWS_REGION}"
            printf 'export CLUSTERS=%q\n' "${MGMT_CLUSTER} ${WORKLOAD_CLUSTER}"
            cat /tmp/cleanup_body.sh
          } > /tmp/cleanup.sh

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "k8s-cleanup-${GITHUB_RUN_ID}" \
            --timeout-seconds 600 \
            --parameters "$(jq -n \
              --arg s "$(cat /tmp/cleanup.sh)" \
              '{commands:[$s], executionTimeout:["1200"]}')" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM command id=${CMD_ID}"

          STATUS=Pending
          for i in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "SSM status=${STATUS}"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac
            sleep 5
          done

          echo "----- cleanup output -----"
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query StandardOutputContent \
            --output text
          echo "----- cleanup errors -----"
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query StandardErrorContent \
            --output text

          [[ "${STATUS}" == "Success" ]]
      - name: Terraform destroy plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -destroy -input=false -lock-timeout=5m -var-file=terraform.tfvars -out=tfdestroy
      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfdestroy
      - name: Remove terraform.tfvars
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: rm -f terraform.tfvars tfdestroy
