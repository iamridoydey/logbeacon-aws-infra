name: Main ci on merge

on:
  push:
    branches:
      - main
    paths:
      - terraform/main-infra/**
      - ansible/**
      - .github/workflows/main-ci-merge.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One apply at a time. Do not share this group with the PR workflow.
concurrency:
  group: main-infra
  cancel-in-progress: false

jobs:
  configure-aws-apply-and-bootstrap:
    name: Configure aws, apply infra, bootstrap cluster
    runs-on: ubuntu-latest
    # Manual approval in GitHub Environment settings.
    environment: main-infra-production
    timeout-minutes: 90

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: terraform/main-infra

    steps:
      # Same action majors as the rest of the project pipelines.
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-infra-bootstrap-ci-role

      # terraform_wrapper: false = real terraform binary, no stdout wrapper.
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      # Maps must NOT be wrapped in extra quotes or Terraform sees a string.
      # Store LOGBEACON_SECRETS / GH_SECRETS / CLOUDFLARE_SECRETS as HCL:
      #   { key = "value" }
      # Passwords and names stay quoted — they are strings.
      - name: Generate terraform.tfvars
        working-directory: ${{ env.TF_DIR }}
        env:
          LOGBEACON_SECRETS_HCL: ${{ secrets.LOGBEACON_SECRETS }}
          GITHUB_SECRETS_HCL: ${{ secrets.GH_SECRETS }}
          CLOUDFLARE_SECRETS_HCL: ${{ secrets.CLOUDFLARE_SECRETS }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD }}
          SONARQUBE_MONITORING_PASSCODE: ${{ secrets.SONARQUBE_MONITORING_PASSCODE }}
        run: |
          set -euo pipefail
          umask 077
          cat > terraform.tfvars <<EOF
          logbeacon_secrets = ${LOGBEACON_SECRETS_HCL}
          github_secrets = ${GITHUB_SECRETS_HCL}
          cloudflare_secrets = ${CLOUDFLARE_SECRETS_HCL}
          sonarqube_admin_password = "${SONARQUBE_ADMIN_PASSWORD}"
          environment = "${{ vars.ENVIRONMENT }}"
          sonarqube_monitoring_passcode = "${SONARQUBE_MONITORING_PASSCODE}"
          EOF

      - name: Terraform init, validate, plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -var-file=terraform.tfvars -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "frontend_image_url=$(terraform output -raw frontend_image_url)" >> "$GITHUB_OUTPUT"
          echo "backend_image_url=$(terraform output -raw backend_image_url)" >> "$GITHUB_OUTPUT"
          echo "management_cluster_name=$(terraform output -raw management_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "workload_cluster_name=$(terraform output -raw workload_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "logbeacon_admin_ec2_id=$(terraform output -raw logbeacon_admin_ec2_id)" >> "$GITHUB_OUTPUT"

      # Wait until SSM Agent on the new (or existing) instance is Online.
      - name: Wait for admin instance SSM
        env:
          INSTANCE_ID: ${{ steps.tf_outputs.outputs.logbeacon_admin_ec2_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text || true)
            echo "SSM ping=${status}"
            if [[ "${status}" == "Online" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Admin instance never reported Online to SSM"
          exit 1

      # inventory.ini uses connection: amazon.aws.aws_ssm
      # pip install ansible does NOT install that plugin.
      # amazon.aws collection + boto3 + session-manager-plugin are required.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible SSM connection
        run: |
          pip install ansible boto3 botocore
          ansible-galaxy collection install amazon.aws
          curl -sS -o /tmp/ssm.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/ssm.deb

      - name: Install tools on admin with Ansible
        run: |
          ansible-playbook ansible/playbook.yaml -i ansible/inventory.ini \
            -e "management_cluster_name=${{ steps.tf_outputs.outputs.management_cluster_name }}" \
            -e "aws_region=${AWS_REGION}"

      # Run the cluster bootstrap ON the admin EC2.
      # send-command = fire a script and wait.
      # start-session = interactive login (useless in CI).
      #
      # Instance profile must allow eks:DescribeCluster (update-kubeconfig)
      # and the instance must reach the EKS API.
      #
      # Why send-command?
      # There is no interactive CLI user on the runner.
      # Put the work in a script, SSM executes it on the instance.
      - name: Bootstrap Argo CD on admin EC2
        env:
          INSTANCE_ID: ${{ steps.tf_outputs.outputs.logbeacon_admin_ec2_id }}
          CLUSTER: ${{ steps.tf_outputs.outputs.management_cluster_name }}
          GITHUB_USERNAME: ${{ vars.GH_USERNAME }}
        run: |
          set -euo pipefail

          cat > /tmp/bootstrap.sh <<EOF
          set -euo pipefail
          export AWS_REGION="${AWS_REGION}"
          aws eks update-kubeconfig --name "${CLUSTER}" --region "${AWS_REGION}"
          if [ ! -d /opt/logbeacon-aws-k8s ]; then
            sudo git clone https://github.com/${GITHUB_USERNAME}/logbeacon-aws-k8s.git /opt/logbeacon-aws-k8s
          else
            sudo git -C /opt/logbeacon-aws-k8s pull --ff-only
          fi
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --wait \
            -f /opt/logbeacon-aws-k8s/argocd/argocd-values.yaml
          kubectl apply -f /opt/logbeacon-aws-k8s/argocd/management-root.yaml
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "argocd-bootstrap-${GITHUB_RUN_ID}" \
            --timeout-seconds 1200 \
            --parameters commands="$(cat /tmp/bootstrap.sh)" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command id=${CMD_ID}"
          aws ssm wait command-executed \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}"

          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

      # From here ArgoCD app-of-apps reconciles downstream apps
      # (external-secrets, cert-manager, sonarqube, workload-root).

      - name: Remove terraform.tfvars
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: rm -f terraform.tfvars tfplan