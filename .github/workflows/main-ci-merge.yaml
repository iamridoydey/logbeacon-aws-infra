name: Main ci on merge

on:
  push:
    branches:
      - main
    paths:
      - terraform/main-infra/**
      - .github/workflows/main-ci-merge.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: main-infra
  cancel-in-progress: false

jobs:
  configure-aws-apply-and-bootstrap:
    name: Configure aws, apply infra, bootstrap cluster
    runs-on: ubuntu-latest
    environment: main-infra-production
    timeout-minutes: 90

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: terraform/main-infra

    steps:
      # Same majors as the rest of the project pipelines.
      - name: Clone the repository
        uses: actions/checkout@v7

      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-infra-bootstrap-ci-role

      # terraform_wrapper: false = no longer need to output ${{ steps.tf.outputs.stdout }}
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      # Generate terraform.tfvars
      - name: Generate terraform.tfvars
        working-directory: ${{ env.TF_DIR }}
        env:
          LOGBEACON_SECRETS_HCL: ${{ secrets.LOGBEACON_SECRETS }}
          GITHUB_SECRETS_HCL: ${{ secrets.GH_SECRETS }}
          CLOUDFLARE_SECRETS_HCL: ${{ secrets.CLOUDFLARE_SECRETS }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD }}
          SONARQUBE_MONITORING_PASSCODE: ${{ secrets.SONARQUBE_MONITORING_PASSCODE }}
        run: |
          set -euo pipefail
          umask 077
          cat > terraform.tfvars <<EOF
          logbeacon_secrets = ${LOGBEACON_SECRETS_HCL}
          github_secrets = ${GITHUB_SECRETS_HCL}
          cloudflare_secrets = ${CLOUDFLARE_SECRETS_HCL}
          sonarqube_admin_password = "${SONARQUBE_ADMIN_PASSWORD}"
          environment = "${{ vars.ENVIRONMENT }}"
          sonarqube_monitoring_passcode = "${SONARQUBE_MONITORING_PASSCODE}"
          EOF

      - name: Terraform init, validate, plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -var-file=terraform.tfvars -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "frontend_image_url=$(terraform output -raw frontend_image_url)" >> "$GITHUB_OUTPUT"
          echo "backend_image_url=$(terraform output -raw backend_image_url)" >> "$GITHUB_OUTPUT"
          echo "management_cluster_name=$(terraform output -raw management_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "workload_cluster_name=$(terraform output -raw workload_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "logbeacon_admin_ec2_id=$(terraform output -raw logbeacon_admin_ec2_id)" >> "$GITHUB_OUTPUT"

      # Wait until SSM Agent on the new (or existing) instance is Online.
      - name: Wait for admin instance SSM
        env:
          INSTANCE_ID: ${{ steps.tf_outputs.outputs.logbeacon_admin_ec2_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text || true)
            echo "SSM ping=${status}"
            if [[ "${status}" == "Online" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Admin instance never reported Online to SSM"
          exit 1

      # Setup and run ansible playbook
      - name: Install tools on admin with Ansible
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ansible

          ansible-playbook ansible/playbook.yaml -i ansible/inventory.ini \
            -e "management_cluster_name=${{ steps.tf_outputs.outputs.management_cluster_name }}" \
            -e "aws_region=${AWS_REGION}"

      # Run the cluster bootstrap ON the admin EC2.
      # send-command = fire a script and wait. start-session = interactive login (useless here).
      #
      # The instance profile must allow eks:DescribeCluster (update-kubeconfig)
      # and the node/instance must reach the EKS API.
      - name: Bootstrap Argo CD on admin EC2
        env:
          INSTANCE_ID: ${{ steps.tf_outputs.outputs.logbeacon_admin_ec2_id }}
          CLUSTER: ${{ steps.tf_outputs.outputs.management_cluster_name }}
          GITHUB_USERNAME: ${{ vars.GH_USERNAME }}
        run: |
          set -euo pipefail

          # Script that SSM will execute as root/ssm-user on the instance.
          # Unquoted EOF: ${CLUSTER}, ${AWS_REGION}, ${GITHUB_USERNAME} are filled in here on the runner.
          cat > /tmp/bootstrap.sh <<EOF
          #!/bin/bash
          set -euo pipefail
          export HOME=/root
          export AWS_REGION="${AWS_REGION}"
          aws eks update-kubeconfig --name "${CLUSTER}" --region "${AWS_REGION}"

          cd /opt
          # Idempotent: the admin instance persists, so the repo may already exist.
          if [ -d logbeacon-aws-k8s/.git ]; then
            git -C logbeacon-aws-k8s pull --ff-only
          else
            git clone https://github.com/${GITHUB_USERNAME}/logbeacon-aws-k8s.git
          fi

          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --wait \
            -f /opt/logbeacon-aws-k8s/argocd/argocd-values.yaml

          kubectl apply -f /opt/logbeacon-aws-k8s/argocd/management-root.yaml
          EOF

          # Why we are using send-command?
          # Because in interactive session we have to run the command from cli.
          # But there is no cli user. That's why we put all the task in the bootstrap.sh.
          # Then this file execute and we will successfully able to start the root argo app.
          # jq builds the JSON so commas/quotes in the script can't break --parameters.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "argocd-bootstrap-${GITHUB_RUN_ID}" \
            --timeout-seconds 1200 \
            --parameters "$(jq -n --arg s "$(cat /tmp/bootstrap.sh)" '{commands:[$s]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command id=${CMD_ID}"

          # Poll instead of `aws ssm wait` (its waiter gives up after ~100s,
          # but helm --wait can take longer). Up to 20 minutes here.
          STATUS=Pending
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${CMD_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            echo "SSM status=${STATUS}"
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          # Always print the output, even on failure.
          aws ssm get-command-invocation \
            --command-id "${CMD_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          # Fail the step unless the script really succeeded.
          [[ "${STATUS}" == "Success" ]]

      - name: Remove terraform.tfvars
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: rm -f terraform.tfvars tfplan