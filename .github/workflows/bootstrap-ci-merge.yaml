name: Bootstrap ci on merge
on:
  push:
    branches:
      - main
    paths:
      - terraform/bootstrap-infra/**
      - .github/workflows/bootstrap-ci-merge.yaml
  workflow_dispatch:

permissions:
  contents: read
  # Permission for requesting a short lived OIDC token
  id-token: write
  # Provide access the CodeQL Action API endpoints
  security-events: write

jobs:
  configure-aws-and-apply-tf:
    name: Configure aws and run tf
    runs-on: ubuntu-latest
    # Pauses for approval
    environment: bootstrap-production

    steps:
      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: "${{ vars.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/bootstrap-infra-role"

      # Clone git repo
      - uses: actions/checkout@v7

      # Generate terraform.tfvars
      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<-EOF
          environment = "${{ vars.ENVIRONMENT }}"
          github_username = "${{ vars.GH_USERNAME }}"
          github_account_id = "${{ vars.GH_ACCOUNT_ID }}"
          github_repo_id = "${{ vars.GH_REPO_ID }}"
          EOF


      # terraform_wrapper: false = no longer need to output ${{ steps.tf.outputs.stdout }}
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/bootstrap-infra
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: terraform/bootstrap-infra
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/bootstrap-infra
        run: |
          terraform plan \
            -input=false \
            -var-file="terraform.tfvars" \
            -out=tfplan

      - name: Terraform apply
        working-directory: terraform/bootstrap-infra
        run: |
          terraform apply \
            -input=false \
            -auto-approve \
            tfplan