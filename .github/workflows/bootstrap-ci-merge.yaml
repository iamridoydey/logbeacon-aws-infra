name: Bootstrap ci on merge
on:
  push:
    branches:
      - main
    paths:
      - terraform/bootstrap-infra/**
  workflow_dispatch:

permissions:
  contents: read
  # Permission for requesting a short lived OIDC token
  id-token: write
  # Provide access the CodeQL Action API endpoints
  security-events: write

jobs:
  configure-aws-and-apply-tf:
    name: Configure aws and run tf
    runs-on: ubuntu-latest
    # Pauses for approval
    environment: bootstrap-production

    steps:
      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: "${{ vars.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/bootstrap-infra-role"

      # Clone git repo
      - uses: actions/checkout@v7

      # Generate terraform.tfvars
      - name: Generate terraform.tfvars
        run: |
          cat > terraform.tfvars <<-EOF
          environment = "${{ vars.ENVIRONMENT }}"
          github_username = "${{ vars.GH_USERNAME }}"
          EOF

          mv terraform.tfvars terraform/bootstrap-infra

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"

      - name: Run terraform init and plan
        id: plan
        working-directory: terraform/bootstrap-infra
        run: |
          terraform init
          terraform plan --var-file="terraform.tfvars"

      - run: echo "${{ steps.plan.outputs.stdout }}"
      - run: echo "${{ steps.plan.outputs.stderr }}"
      - run: echo "${{ steps.plan.outputs.exitcode }}"

      - name: Run terraform apply
        env:
          # Passing GITHUB_TOKEN prevents rate-limiting during plugin downloads
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: apply
        working-directory: terraform/bootstrap-infra
        run: |
          terraform apply -auto-approve --var-file="terraform.tfvars"

      - run: echo "${{ steps.apply.outputs.stdout }}"
      - run: echo "${{ steps.apply.outputs.stderr }}"
      - run: echo "${{ steps.apply.outputs.exitcode }}"