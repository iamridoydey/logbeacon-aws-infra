name: Main ci on pull request
on:
  pull_request:
    branches:
      - main
    paths:
      - terraform/main-infra/**
      - ansible/**
      - .github/workflows/main-ci-pr.yaml

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: main-infra
  cancel-in-progress: false
jobs:
  # Infra validations
  infra-validations:
    name: Infra validations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provide access the CodeQL Action API endpoints
      security-events: write

    steps:
      # Clone git repo
      - uses: actions/checkout@v7

      # terraform_wrapper: false = no longer need to output ${{ steps.tf.outputs.stdout }}
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Terraform fmt
        id: fmt
        working-directory: terraform/main-infra
        run: terraform fmt -check -recursive
        continue-on-error: true

      # Setup tflint and run it
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.52.0
          cache: true

      - name: Show version and initialize plugin
        working-directory: terraform/main-infra
        run: |
          tflint --version
          tflint --init
        env:
          # Passing GITHUB_TOKEN prevents rate-limiting during plugin downloads
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        working-directory: terraform/main-infra
        run: tflint --recursive --format=compact

      # Setup Checkov and run test for security
      - name: Run Checkov Action
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/main-infra
          framework: terraform
          output_format: sarif
          output_file_path: results.sarif

      - name: Upload results to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: results.sarif

  # Ansible validations
  ansible-validations:
    name: Ansible validations
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Clone git repo
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint

      - name: Ansible syntax check
        working-directory: ansible
        run: ansible-playbook --syntax-check playbook.yaml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint playbook.yaml

  # Configure aws and tf ansible validation
  configure-aws-and-tf-ansible-validation:
    name: Configure aws and tf ansible validation
    runs-on: ubuntu-latest
    needs:
      - infra-validations
      - ansible-validations
    permissions:
      contents: read
      # Permission for requesting a short lived OIDC token
      id-token: write

    steps:
      - name: Configure aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: "${{ vars.AWS_REGION }}"
          role-to-assume: "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/logbeacon-infra-bootstrap-pr-role"

      # Clone git repo
      - uses: actions/checkout@v7

      # Generate terraform.tfvars
      - name: Generate terraform.tfvars
        working-directory: terraform/main-infra
        env:
          LOGBEACON_SECRETS_HCL: ${{ secrets.LOGBEACON_SECRETS }}
          GITHUB_SECRETS_HCL: ${{ secrets.GH_SECRETS }}
          CLOUDFLARE_SECRETS_HCL: ${{ secrets.CLOUDFLARE_SECRETS }}
          SONARQUBE_ADMIN_PASSWORD: ${{ secrets.SONARQUBE_ADMIN_PASSWORD }}
          SONARQUBE_MONITORING_PASSCODE: ${{ secrets.SONARQUBE_MONITORING_PASSCODE }}
        run: |
          set -euo pipefail
          umask 077
          cat > terraform.tfvars <<EOF
          logbeacon_secrets = ${LOGBEACON_SECRETS_HCL}
          github_secrets = ${GITHUB_SECRETS_HCL}
          cloudflare_secrets = ${CLOUDFLARE_SECRETS_HCL}
          sonarqube_admin_password = "${SONARQUBE_ADMIN_PASSWORD}"
          environment = "${{ vars.ENVIRONMENT }}"
          sonarqube_monitoring_passcode = "${SONARQUBE_MONITORING_PASSCODE}"
          EOF

      # Must match the version used by the merge workflow. Terraform refuses to
      # read state that was written by a newer version.
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Run terraform init and plan
        env:
          # Passing GITHUB_TOKEN prevents rate-limiting during plugin downloads
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: plan
        working-directory: terraform/main-infra
        run: |
          terraform init -input=false
          terraform plan -input=false -lock-timeout=5m -var-file="terraform.tfvars"

      - name: Remove terraform.tfvars
        if: always()
        working-directory: terraform/main-infra
        run: rm -f terraform.tfvars
